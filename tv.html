<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMG TABLE TENNIS COMPETITION — TV</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#071b45;color:#fff}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff26;padding-bottom:20px}.brand{font-size:clamp(24px,3vw,44px);font-weight:900}.sub{opacity:.7}.live{background:#13b477;border-radius:999px;padding:10px 16px;font-weight:900}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;margin-top:22px}.card{background:#fff;color:#14213d;border-radius:22px;padding:24px}.label{font-size:13px;font-weight:900;color:#68758d;text-transform:uppercase}.round{font-size:20px;font-weight:900;margin-top:6px}.next{text-align:center;margin-top:28px}.players{font-size:clamp(30px,5vw,72px);font-weight:900}.vs{font-size:20px;color:#68758d;margin:12px}.up{font-weight:900;margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #edf0f4}.table th{font-size:11px;color:#68758d}.table td{font-size:16px}.matches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.match{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:#f4f7fb}.pending{color:#68758d}.complete{font-weight:900}@media(max-width:900px){.grid{grid-template-columns:1fr}.matches{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header class="top"><div><div class="brand">BMG TABLE TENNIS COMPETITION</div><div class="sub">LIVE TOURNAMENT DISPLAY • 16 PLAYERS • 15 ROUNDS • 120 MATCHES</div></div><div class="live">● LIVE</div></header>
<main class="grid">
<section class="card"><div class="label">Current Round</div><div class="round" id="roundLabel">Loading…</div><div class="next"><div class="label">Next Match</div><div id="nextMatch"><div class="players">Loading…</div></div></div><div style="margin-top:28px"><div class="label">Round Matches</div><div class="matches" id="roundMatches"></div></div></section>
<section class="card"><h2>🏆 Standings</h2><table class="table"><thead><tr><th>#</th><th>Player</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th>Odds</th></tr></thead><tbody id="standings"></tbody></table></section>
</main></div>
<script>
const sb=supabase.createClient(window.BMG_SUPABASE_URL,window.BMG_SUPABASE_KEY);let players=[],matches=[],settings={active_round:1};
async function load(){const [p,m,s]=await Promise.all([sb.from('players').select('*').order('id'),sb.from('matches').select('*').order('round').order('match_number'),sb.from('tournament_settings').select('*').eq('id',1).single()]);if(p.error||m.error||s.error){document.getElementById('nextMatch').innerHTML='<div class="players">Connection error</div>';return}players=p.data;matches=m.data;settings=s.data;render()}
const name=id=>players.find(p=>p.id===id)?.name||'?';
function standings(){const map=Object.fromEntries(players.map(p=>[p.id,{...p,pts:0,w:0,d:0,l:0}]));for(const m of matches){if(m.status!=='completed'||m.player1_score==null||m.player2_score==null)continue;const a=map[m.player1_id],b=map[m.player2_id];if(!a||!b)continue;if(m.player1_score>m.player2_score){a.w++;a.pts+=3;b.l++}else if(m.player2_score>m.player1_score){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}return Object.values(map).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.name.localeCompare(b.name))}
function odds(s){const raw=s.map(x=>Math.max(.25,1+x.pts+.25*x.w-.25*x.l));const total=raw.reduce((a,b)=>a+b,0);return Object.fromEntries(s.map((x,i)=>[x.id,total/raw[i]]))}function render(){const r=settings.active_round,ms=matches.filter(m=>m.round===r),pending=ms.filter(m=>m.status!=='completed'),next=pending[0],s=standings(),o=odds(s);document.getElementById('roundLabel').textContent='Round '+r+' • '+ms.filter(m=>m.status==='completed').length+'/7 matches complete';document.getElementById('nextMatch').innerHTML=next?'<div class="players">'+name(next.player1_id)+'<div class="vs">VS</div>'+name(next.player2_id)+'</div><div class="up">UP NEXT • Match '+next.match_number+'</div>':'<div class="players">Round Complete</div>';document.getElementById('roundMatches').innerHTML=ms.map(m=>'<div class="match"><span>'+name(m.player1_id)+' vs '+name(m.player2_id)+'</span><span class="'+(m.status==='completed'?'complete':'pending')+'">'+(m.status==='completed'?m.player1_score+' – '+m.player2_score:'Pending')+'</span></div>').join('');document.getElementById('standings').innerHTML=s.map((x,i)=>'<tr><td><b>'+(i+1)+'</b></td><td><b>'+x.name+'</b></td><td><b>'+x.pts+'</b></td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+o[x.id].toFixed(2)+'</td></tr>').join('')}
sb.channel('bmg-tv-live').on('postgres_changes',{event:'*',schema:'public',table:'matches'},load).on('postgres_changes',{event:'*',schema:'public',table:'tournament_settings'},load).subscribe();load();
</script></body></html>
