<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BMG TABLE TENNIS COMPETITION</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#14213d}
header{background:linear-gradient(135deg,#071b45,#164b9b);color:#fff;padding:20px;text-align:center}
header img{height:55px;max-width:180px;object-fit:contain;display:block;margin:0 auto 8px}
h1{font-size:25px;margin:5px}.sub{opacity:.8;font-size:12px}
main{max-width:1200px;margin:auto;padding:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
button,input{padding:11px;border:1px solid #d5deeb;border-radius:10px;background:#fff;font:inherit}
button{cursor:pointer;font-weight:bold}.primary{background:#0b2d67;color:white}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button.active{background:#0b2d67;color:#fff}
.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}
.notice{background:#eef5ff;border-radius:12px;padding:12px;margin:10px 0}
.match{display:grid;grid-template-columns:50px 1fr 100px;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f4;align-items:center}
.num{font-size:12px;color:#738099}.players{font-weight:bold}.score{text-align:right;font-weight:bold}.pending{color:#b87900}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #edf0f4;font-size:13px}
th{font-size:11px;color:#69758a}.empty{text-align:center;padding:18px;color:#68758d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px}.stat b{display:block;font-size:25px}
.stat span{font-size:12px;color:#68758d}
@media(max-width:800px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.match{grid-template-columns:40px 1fr 85px}}
</style>
</head>
<body>
<header>
<img src="credo-sponsor.png.png" alt="CREDO Sponsor">
<h1>BMG TABLE TENNIS COMPETITION</h1>
<div class="sub">16 players • 120 preliminary matches • Knockout stages</div>
</header>
<main>
<div class="toolbar"><button class="primary" onclick="loadAll()">↻ Refresh</button><input id="search" placeholder="Search player" oninput="render()"></div>
<div id="stats" class="stats"></div>
<section class="card">
<h2>Tournament stages</h2>
<div id="tabs" class="tabs"></div>
<div id="stageInfo"></div>
<div id="stageMatches"></div>
</section>
<div class="grid">
<section class="card"><h2>🏓 Current / Next Matches</h2><div id="current"></div></section>
<section class="card"><h2>🏆 Preliminary Standings</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>PD</th><th>PTS</th><th>Odds</th></tr></thead><tbody id="standings"></tbody></table></div></section>
</div>
</main>
<script>
const sb=supabase.createClient(window.BMG_SUPABASE_URL,window.BMG_SUPABASE_KEY);
const stages=['Preliminaries','Playoffs','Quarterfinals','Semifinals','Finals'];
let players=[],matches=[],stage='Preliminaries';

function stageOf(m){return m.stage||'Preliminaries'}
function done(m){return m.status==='completed'&&m.player1_score!=null&&m.player2_score!=null}
function pname(id){return players.find(p=>Number(p.id)===Number(id))?.name||null}
function safe(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function prelim(){return matches.filter(m=>stageOf(m)==='Preliminaries')}
function standings(){
 const map=Object.fromEntries(players.map(p=>[p.id,{...p,p:0,w:0,l:0,pf:0,pa:0,pd:0,pts:0}]));
 prelim().filter(done).forEach(m=>{
  let a=map[m.player1_id],b=map[m.player2_id];if(!a||!b)return;
  a.p++;b.p++;a.pf+=+m.player1_score;b.pf+=+m.player2_score;
  a.pa+=+m.player2_score;b.pa+=+m.player1_score;a.pd=a.pf-a.pa;b.pd=b.pf-b.pa;
  if(+m.player1_score>+m.player2_score){a.w++;a.pts+=3;b.l++}
  else if(+m.player2_score>+m.player1_score){b.w++;b.pts+=3;a.l++}
  else{a.pts++;b.pts++}
 });
 return Object.values(map).sort((a,b)=>b.pts-a.pts||b.pd-a.pd||b.w-a.w||String(a.name).localeCompare(String(b.name)));
}
function winner(m){if(m.winner_id!=null)return m.winner_id;if(!done(m))return null;return +m.player1_score>+m.player2_score?m.player1_id:m.player2_id}
function playoffWinner(n){let a=matches.filter(m=>stageOf(m)==='Playoffs').sort((a,b)=>a.match_number-b.match_number);return a[n]?winner(a[n]):null}
function label(id,fallback){return id!=null?(pname(id)||fallback):fallback}
function rowsFor(st){
 let rows=matches.filter(m=>stageOf(m)===st).sort((a,b)=>a.match_number-b.match_number);
 if(rows.length)return rows.map(m=>({m,one:label(m.player1_id,'Waiting for player'),two:label(m.player2_id,'Waiting for player'),num:m.match_number}));
 let s=standings();
 if(st==='Quarterfinals')return [
  {one:label(s[0]?.id,'Top 1'),two:label(playoffWinner(3),'Waiting for Playoff 4 winner'),num:1},
  {one:label(s[1]?.id,'Top 2'),two:label(playoffWinner(2),'Waiting for Playoff 3 winner'),num:2},
  {one:label(s[2]?.id,'Top 3'),two:label(playoffWinner(1),'Waiting for Playoff 2 winner'),num:3},
  {one:label(s[3]?.id,'Top 4'),two:label(playoffWinner(0),'Waiting for Playoff 1 winner'),num:4}
 ];
 if(st==='Semifinals')return [
  {one:'Winner of Quarterfinal 1',two:'Winner of Quarterfinal 2',num:1},
  {one:'Winner of Quarterfinal 3',two:'Winner of Quarterfinal 4',num:2}
 ];
 if(st==='Finals')return [{one:'Winner of Semifinal 1',two:'Winner of Semifinal 2',num:1}];
 return [];
}
function matchHTML(r){
 let m=r.m,d=m&&done(m);
 return `<div class="match"><div class="num">M${r.num}</div><div class="players">${safe(r.one)}<br><span style="font-size:12px;color:#68758d">vs</span><br>${safe(r.two)}</div><div class="score">${d?safe(m.player1_score+' – '+m.player2_score):'<span class="pending">PENDING</span>'}</div></div>`;
}
function render(){
 let s=standings(),q=(document.getElementById('search').value||'').toLowerCase(),allDone=matches.filter(done).length;
 document.getElementById('stats').innerHTML=`<div class="stat"><b>${allDone}</b><span>Matches completed</span></div><div class="stat"><b>${matches.length-allDone}</b><span>Matches pending</span></div><div class="stat"><b>${prelim().length}</b><span>Preliminary matches</span></div><div class="stat"><b>${s[0]?.pts||0}</b><span>Leader points</span></div>`;
 document.getElementById('tabs').innerHTML=stages.map(x=>`<button class="${x===stage?'active':''}" onclick="stage='${x}';render()">${x}</button>`).join('');
 let rows=rowsFor(stage);
 document.getElementById('stageInfo').innerHTML=(stage==='Quarterfinals'||stage==='Semifinals'||stage==='Finals')?'<div class="notice">Qualified players are shown now. Waiting placeholders will become player names when the earlier stage is completed.</div>':'';
 document.getElementById('stageMatches').innerHTML=rows.length?rows.map(matchHTML).join(''):'<div class="empty">No matches have been created for this stage yet.</div>';
 let current=stage==='Preliminaries'?prelim().filter(m=>!done(m)).map(m=>({m,one:label(m.player1_id,'Player 1'),two:label(m.player2_id,'Player 2'),num:m.match_number})):rows.filter(r=>!r.m||!done(r.m));
 document.getElementById('current').innerHTML=current.length?current.slice(0,8).map(matchHTML).join(''):'<div class="empty">No pending matches in this stage.</div>';
 let raw=s.map(x=>Math.max(.25,1+x.pts+.25*x.w-.25*x.l+.05*x.pd)),total=raw.reduce((a,b)=>a+b,0)||1;
 document.getElementById('standings').innerHTML=s.filter(x=>!q||String(x.name).toLowerCase().includes(q)).map((x,i)=>`<tr><td>${i+1}</td><td><b>${safe(x.name)}</b></td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pf}</td><td>${x.pa}</td><td>${x.pd}</td><td><b>${x.pts}</b></td><td>${(total/raw[s.indexOf(x)]).toFixed(2)}</td></tr>`).join('');
}
async function loadAll(){
 let [p,m]=await Promise.all([sb.from('players').select('*').order('id'),sb.from('matches').select('*').order('round').order('match_number')]);
 if(p.error||m.error){document.getElementById('stageInfo').innerHTML='<div class="empty">Unable to load tournament records. Please refresh.</div>';return}
 players=p.data||[];matches=m.data||[];render();
}
sb.channel('bmg-public-live').on('postgres_changes',{event:'*',schema:'public',table:'matches'},loadAll).subscribe();
loadAll();
</script>
</body>
</html>
