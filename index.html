<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMG TABLE TENNIS COMPETITION</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7fb;color:#14213d}header{background:linear-gradient(135deg,#071b45,#164b9b);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:5}.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:25px;font-weight:950}.sub{opacity:.78;font-size:12px;margin-top:3px}.live{background:#13b477;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}.wrap{max-width:1180px;margin:auto;padding:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.btn,.select,.search{border:1px solid #dbe2ec;border-radius:11px;padding:11px 13px;background:#fff;font:inherit}.btn{cursor:pointer;font-weight:850}.primary{background:#0b2d67;color:#fff;border-color:#0b2d67}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:18px;padding:17px;box-shadow:0 5px 20px #15284d0b;margin-bottom:16px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.title h2{font-size:18px;margin:0}.muted{color:#68758d;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e3e8f0;border-radius:14px;padding:13px}.stat b{display:block;font-size:25px}.stat span{font-size:11px;color:#6d7890}.match{display:grid;grid-template-columns:55px 1fr 110px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}.match:last-child{border-bottom:0}.mnum{font-size:11px;color:#77839a;font-weight:850}.players{font-weight:850}.score{font-weight:950;text-align:right}.next{border:2px solid #1a74e8;background:#f7fbff}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid #edf0f4;font-size:13px}.table th{font-size:11px;color:#69758a}.rank{font-weight:950}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef3fa;font-size:11px;font-weight:800}.empty{padding:18px;text-align:center;color:#68758d}.search{min-width:220px}.full{grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start}.brand{font-size:20px}.wrap{padding:12px}.match{grid-template-columns:45px 1fr 80px}}
</style></head><body><header><div class="head"><div><div class="brand">BMG TABLE TENNIS COMPETITION</div><div class="sub">14 players • 13 rounds • 91 matches</div></div><div class="live">● LIVE</div></div></header><main class="wrap"><div class="toolbar"><button class="btn primary" onclick="loadAll()">↻ Refresh</button><select id="round" class="select" onchange="renderRound()"></select><input id="search" class="search" placeholder="Search player" oninput="renderAll()"></div><section class="stats" id="stats"></section><div class="grid"><section class="card"><div class="title"><h2>🏓 Current / Next Matches</h2><span class="muted" id="roundLabel"></span></div><div id="nextMatches"></div></section><section class="card"><div class="title"><h2>🏆 Standings</h2><span class="muted">3 / 1 / 0 points</span></div><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th>P</th></tr></thead><tbody id="standings"></tbody></table></div></section><section class="card full"><div class="title"><h2>📅 Round Schedule</h2><span class="muted">Completed results appear automatically</span></div><div id="roundMatches"></div></section></div></main><script>
const sb=supabase.createClient(window.BMG_SUPABASE_URL,window.BMG_SUPABASE_KEY);let players=[],matches=[],settings={active_round:1};
async function loadAll(){const [p,m,s]=await Promise.all([sb.from('players').select('*').order('id'),sb.from('matches').select('*').order('round').order('match_number'),sb.from('tournament_settings').select('*').eq('id',1).single()]);if(p.error||m.error||s.error){document.body.innerHTML='<div style="padding:30px;font-family:system-ui"><h2>Unable to load tournament</h2><p>Please refresh the page.</p></div>';return}players=p.data;matches=m.data;settings=s.data;buildRoundSelect();renderAll()}
function buildRoundSelect(){const el=document.getElementById('round'),old=+el.value||settings.active_round;el.innerHTML='';for(let r=1;r<=13;r++){const o=document.createElement('option');o.value=r;o.textContent='Round '+r+(r===settings.active_round?' • ACTIVE':'');el.appendChild(o)}el.value=Math.min(old,13)}
function standings(){const map=Object.fromEntries(players.map(p=>[p.id,{...p,pts:0,w:0,d:0,l:0,p:0}]));for(const m of matches){if(m.status!=='completed'||m.player1_score==null||m.player2_score==null)continue;const a=map[m.player1_id],b=map[m.player2_id];a.p++;b.p++;if(m.player1_score>m.player2_score){a.w++;a.pts+=3;b.l++}else if(m.player2_score>m.player1_score){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}}return Object.values(map).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.name.localeCompare(b.name))}
function renderAll(){const s=standings(),q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('stats').innerHTML=`<div class="stat"><b>${matches.filter(m=>m.status==='completed').length}</b><span>Matches completed</span></div><div class="stat"><b>${91-matches.filter(m=>m.status==='completed').length}</b><span>Matches remaining</span></div><div class="stat"><b>${settings.active_round}</b><span>Active round</span></div><div class="stat"><b>${s[0]?.pts||0}</b><span>Leader points</span></div>`;document.getElementById('standings').innerHTML=s.filter(x=>!q||x.name.toLowerCase().includes(q)).map((x,i)=>`<tr><td class="rank">${i+1}</td><td><b>${x.name}</b></td><td><b>${x.pts}</b></td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.p}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No player found</td></tr>';renderRound();renderNext()}
function name(id){return players.find(p=>p.id===id)?.name||'?'}
function renderNext(){const r=settings.active_round,ms=matches.filter(m=>m.round===r),pending=ms.filter(m=>m.status!=='completed');document.getElementById('roundLabel').textContent='Round '+r;document.getElementById('nextMatches').innerHTML=(pending.length?pending:ms).map(m=>`<div class="match ${m.id===(pending[0]?.id)?'next':''}"><div class="mnum">M${m.match_number}</div><div class="players">${name(m.player1_id)}<br>vs<br>${name(m.player2_id)}</div><div class="score">${m.status==='completed'?`${m.player1_score} – ${m.player2_score}`:'UP NEXT'}</div></div>`).join('')||'<div class="empty">Round complete</div>'}
function renderRound(){const r=+document.getElementById('round').value||settings.active_round,ms=matches.filter(m=>m.round===r);document.getElementById('roundMatches').innerHTML=ms.map(m=>`<div class="match"><div class="mnum">M${m.match_number}</div><div class="players">${name(m.player1_id)} <span class="muted">vs</span> ${name(m.player2_id)}</div><div class="score">${m.status==='completed'?`${m.player1_score} – ${m.player2_score}`:'Pending'}</div></div>`).join('')}
sb.channel('bmg-live').on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>loadAll()).on('postgres_changes',{event:'*',schema:'public',table:'tournament_settings'},()=>loadAll()).subscribe();loadAll();
</script></body></html>
